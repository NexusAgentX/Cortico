# 提交前要求跑绿的同一套命令,在两个操作系统上各跑一遍。
name: CI

on:
  push:
    branches: [master]
  pull_request:

# 同一分支的新推送取消仍在跑的旧运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # corepack 下载 pnpm 前会请求确认,CI 里无人应答。
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows runner 比 ubuntu 慢一截;本机全套约 100 秒,30 分钟足够。
    timeout-minutes: 30
    strategy:
      # 两个 OS 都要跑完:跨平台问题往往只在一侧现形。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          # engines.node 要求 >=22;Node 25 起不再附带 corepack,升级时这一步要跟着改。
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # 锁文件在 Windows 上生成,但 pnpm 把各平台的可选包都记在里面
        # (@rollup/rollup-linux-x64-gnu、@esbuild/linux-x64 等),ubuntu 上冻结安装不受影响。
        run: pnpm install --frozen-lockfile

      - name: Typecheck (Node)
        run: pnpm run typecheck

      - name: Typecheck (browser)
        run: pnpm run typecheck:web

      - name: Tests
        run: pnpm test

      - name: Build console bundle
        run: pnpm run build:web
